<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Admin - Historial de Viajes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="admin">

    <header>
        <div class="title" id="cliente-nombre">Cargando...</div>
        <div class="subtitle">Panel de Admnistración</div>
    </header>

    <main class="container">
        
        <div class="stats-container">
            <div class="stat-card">
                <span class="stat-title">Acreditado</span>
                <span class="stat-value paid" id="total-paid">$0.00</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Pendiente</span>
                <span class="stat-value pending" id="total-pending">$0.00</span>
            </div>
        </div>

        <div id="historial-list" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 5rem;">
            <div class="loader"></div>
        </div>

    </main>

    <div class="admin-actions" style="display: flex; gap: 1rem; flex-direction: column; align-items: flex-end;">
        <button class="btn-floating" style="background: linear-gradient(135deg, #3b82f6, #2563eb);" onclick="openModalQuincena()">
            ➕ Nueva Quincena
        </button>
        <button class="btn-floating" onclick="downloadJson()">
            💾 Guardar JSON
        </button>
    </div>

    <!-- Modal for Success Message -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal">
            <h3>✅ Archivo Generado</h3>
            <p>Se ha descargado el nuevo archivo <strong>data.js</strong>.</p>
            <p>Para actualizar los datos en vivo, asegúrate de reemplazar el archivo existente en tu carpeta y subir los cambios a Git.</p>
            <div class="modal-actions">
                <button class="btn-primary" onclick="closeModal('success-modal')">Entendido</button>
            </div>
        </div>
    </div>

    <!-- Modal Quincena -->
    <div class="modal-overlay" id="quincena-modal">
        <div class="modal">
            <h3 id="quincena-modal-title">➕ Nueva Quincena</h3>
            <form id="quincena-form" onsubmit="saveQuincena(event)">
                <input type="hidden" id="q-id">
                <div class="form-group">
                    <label>Periodo (Ej: 2da Quincena Mayo...)</label>
                    <input type="text" id="q-periodo" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Tipo de Cobro</label>
                    <select id="q-tipo" class="form-input" onchange="toggleQuincenaFields()">
                        <option value="2">Paquete (Fijo)</option>
                        <option value="1">Individual (Por viaje)</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.2rem;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Costo Total ($)</label>
                        <input type="number" step="0.01" id="q-total" required class="form-input">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Abonado ($)</label>
                        <input type="number" step="0.01" id="q-abono" value="0" class="form-input">
                    </div>
                </div>
                <div class="form-group" id="wrap-paquete">
                    <label>Viajes del Paquete</label>
                    <input type="number" id="q-viajes-paquete" value="24" class="form-input">
                </div>
                <div class="form-group" id="wrap-acumulados">
                    <label>Viajes Acumulados (de la anterior)</label>
                    <input type="number" id="q-acumulados" value="0" class="form-input">
                </div>
                <div class="modal-actions" style="margin-top: 1.5rem;">
                    <button type="button" class="btn-outline" onclick="closeModal('quincena-modal')">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Viaje -->
    <div class="modal-overlay" id="viaje-modal">
        <div class="modal">
            <h3>➕ Agregar Viaje</h3>
            <form id="viaje-form" onsubmit="saveViaje(event)">
                <input type="hidden" id="v-quincena-id">
                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="v-fecha" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Hora</label>
                    <input type="time" id="v-hora" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Destino</label>
                    <select id="v-destino" class="form-input" required onchange="toggleDestinoOtro()">
                        <option value="al trabajo">al trabajo</option>
                        <option value="a la casa">a la casa</option>
                        <option value="otro">Otro...</option>
                    </select>
                </div>
                <div class="form-group" id="wrap-v-destino-otro" style="display:none;">
                    <label>Especifique destino</label>
                    <input type="text" id="v-destino-otro" class="form-input">
                </div>
                <div class="form-group" id="wrap-v-monto" style="display:none;">
                    <label>Monto ($) - Si aplica</label>
                    <input type="number" step="0.01" id="v-monto" value="0" class="form-input">
                </div>
                <div class="modal-actions" style="margin-top: 1.5rem;">
                    <button type="button" class="btn-outline" onclick="closeModal('viaje-modal')">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
